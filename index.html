<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="./public/favicon.svg" type="image">
    <title>ColorFul Studio</title>
</head>

<body>
    <header class="main-header">
        <img src="./assets/img/colorFul_logo.svg" alt="logo-color-ful" class="logo-color-ful">
    </header>
    <nav>
        <ul id="nav-items">
            <li>
                <button id="generate-btn">
                    Generar aleatoriamente
                </button>
            </li>
            <li>
                <label for="palette-selector">
                    Tamaño
                </label>
                <div class="palette-size" id="palette-size-selector">
                    <button class="active">6</button>
                    <button>8</button>
                    <button>9</button>
                </div>
            </li>
            <li>
                <label for="format-selector">Formato</label>
                <div id="format-selector" name="format-selector">
                    <button id="hex-format-btn" class="active">HEX</button>
                    <button id="hsl-format-btn">HSL</button>
                </div>
            </li>
            <li>
                <button id="save-palette-btn">
                    Guardar Paleta
                    <img src="./assets/img/icons/save_24dp_FFFFFF.svg" alt="save-icon">
                </button>
            </li>
            <li>
                <button id="view-saved-palettes-btn">
                    Ver paletas guardadas
                    <img src="./assets/img/icons/visibility_24dp_FFFFFF.svg" alt="ver-paletas">
                </button>
            </li>
        </ul>
    </nav>

    <main class="palette-container" id="palette-container">
    </main>

    <section id="saved-palettes-section">
        <h2>PALETAS GUARDADAS</h2>
        <div id="saved-palette-container" class="saved-palette-container">
        </div>
    </section>

    <footer>
        <p class="footer-credits">© 2026 ColorFul Studio | Proyecto Frontend | Marco Vizgarra</p>
        <div class="social-links">
            <a href="https://github.com/marcovizgarra" target="_blank" title="GitHub-Link">
                <img src="./assets/img/icons/gitHub_lockup_white.svg" alt="git-hub-link">
            </a>
            <a href="https://www.linkedin.com/in/marco-vizgarra/" target="_blank" title="LinkedIn-Link">
                <img src="./assets/img/icons/linkedin_svgrepo.svg" alt="linkedin-link">
            </a>
        </div>
    </footer>

    <div id="toast-message" class="toast hidden">
        ¡Color copiado!
    </div>
</body>
<script type="module" src="./js/main.js"></script>

</html>
