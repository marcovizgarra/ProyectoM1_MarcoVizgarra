<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>ColorFul Studio</title>
</head>

<body>
    <header class="main-header">
        <img src="./assets/img/webLogo.png" alt="logo-color-ful" class="logo-color-ful">
    </header>
    <nav>
        <ul id="nav-items">
            <li>
                <button id="generate-btn">Generar aleatoriamente</button>
            </li>
            <li>
                <label for="palette-selector">
                    Tamaño de paleta
                </label>
                <div class="palette-size" id="palette-size-selector">
                    <button>6</button>
                    <button>8</button>
                    <button>9</button>
                </div>
            </li>
            <li>
                <label for="format-selector">Formato del color</label>
                <div id="format-selector" name="format-selector">
                    <button id="hex-format-btn">HEX</button>
                    <button id="hsl-format-btn">HSL</button>
                </div>
            </li>
            <li>
                <button id="save-palette-btn">
                    Guardar Paleta
                    <img src="./assets/img/icons/save_24dp_FFFFFF.svg" alt="save-icon">
                </button>
            </li>
            <li>
                <button id="view-saved-palettes-btn">Ver paletas guardadas</button>
            </li>
        </ul>
    </nav>

    <div class="palette-container" id="palette-container">
    </div>

    <section id="saved-palettes-section">
        <h2>Paletas guardadas</h2>
        <div id="saved-palette-container" class="saved-palette-container">
        </div>
    </section>

    <footer>
        <p>ColorFul Studio R</p>
    </footer>

    <div id="toast-message" class="toast hidden">
        ¡Color copiado!
        <img src="./assets/img/icons/check_24dp_FFFFFF.svg" alt="copied-message">
    </div>
</body>
<script src="./js/main.js"></script>

</html>
